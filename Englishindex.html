<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily English Quiz</title>
<style>
  :root{
    --blue:#185FA5;
    --track:#d7dde6;
    --red:#E24B4A;
    --green:#1D9E75;
    --ink:#1b2430;
    --sub:#5b6472;
    --card:#ffffff;
    --bg:#f4f6f9;
    --border:#e2e6ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:16px;
    padding-bottom:60px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:1.5rem;margin:4px 0 4px;}
  .instruction{color:var(--sub);font-size:0.95rem;margin:0 0 16px;}

  /* Top nav bar */
  .navbar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:16px;
    position:sticky;
    top:8px;
    z-index:5;
  }
  .navbar-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .nav-count{font-size:0.85rem;font-weight:600;white-space:nowrap;color:var(--ink);}
  .progress-track{
    flex:1;
    height:6px;
    background:var(--track);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--blue);
    border-radius:4px;
    transition:width .2s ease;
  }
  .jump-btn{
    border:1px solid var(--border);
    background:#fff;
    color:var(--ink);
    border-radius:8px;
    padding:6px 10px;
    font-size:0.82rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .jump-btn:hover{background:#f0f3f7;}
  .results-pill{
    display:none;
    border:none;
    background:var(--green);
    color:#fff;
    border-radius:20px;
    padding:6px 14px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .dot-panel{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
  }
  .dot{
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.72rem;
    font-weight:600;
    cursor:pointer;
    color:#fff;
    background:var(--track);
    color:#5b6472;
    border:none;
  }
  .dot.correct{background:var(--blue);color:#fff;}
  .dot.wrong{background:var(--red);color:#fff;}
  .dot.current{outline:2px solid var(--ink);outline-offset:2px;}

  /* Question card */
  .qcard{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
  }
  .tag{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    color:#fff;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .qnum{font-size:0.8rem;color:var(--sub);font-weight:600;margin-bottom:2px;}
  .stem{font-size:1.05rem;line-height:1.5;margin:6px 0 16px;}
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:0.98rem;
    cursor:pointer;
    color:var(--ink);
    line-height:1.4;
  }
  .opt:hover{border-color:#b7c2d0;}
  .opt.selected-correct{border-color:var(--green);background:#eafaf3;}
  .opt.selected-wrong{border-color:var(--red);background:#fdeceb;}
  .opt.reveal-correct{border-color:var(--green);background:#eafaf3;}
  .opt[disabled]{cursor:default;}
  .explain{
    display:none;
    font-size:0.92rem;
    line-height:1.5;
    background:#f4f7fb;
    border-left:3px solid var(--blue);
    padding:10px 12px;
    border-radius:6px;
    margin-top:6px;
  }
  .explain.show{display:block;}
  .explain b{color:var(--ink);}

  .nav-buttons{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:24px;
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:10px 16px;
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
  }
  .btn-prev,.btn-next{background:var(--blue);color:#fff;}
  .btn-prev:disabled,.btn-next:disabled{background:#b9c6d6;cursor:not-allowed;}

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
  }
  .action-btn{
    flex:1;
    min-width:140px;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .action-btn:hover{background:#f0f3f7;}
  .action-btn.danger{color:var(--red);border-color:#f2c6c4;}

  .results-box{
    display:none;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    text-align:center;
  }
  .results-box .score{font-size:2rem;font-weight:800;color:var(--blue);}

  /* Custom modal (never native confirm) */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,26,34,0.55);
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:22px;
    max-width:360px;
    width:100%;
  }
  .modal-box h3{margin:0 0 8px;font-size:1.1rem;}
  .modal-box p{margin:0 0 18px;font-size:0.92rem;color:var(--sub);line-height:1.4;}
  .modal-buttons{display:flex;gap:10px;justify-content:flex-end;}
  .modal-btn{
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
  }
  .modal-cancel{background:#eef1f5;color:var(--ink);}
  .modal-confirm{background:var(--red);color:#fff;}

  .toast{
    display:none;
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:0.86rem;
    z-index:30;
  }
  .toast.show{display:block;}

  @media (max-width:480px){
    .action-btn{min-width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Daily English Quiz</h1>
  <p class="instruction">Read each question and choose the best answer. Each question is tagged with the English skill area it covers.</p>

  <div class="navbar">
    <div class="navbar-row">
      <span class="nav-count" id="navCount">0 / 20</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <button class="jump-btn" id="jumpBtn" onclick="toggleJump()">Jump &#9662;</button>
      <button class="results-pill" id="resultsPill" onclick="showResults()">Results</button>
    </div>
    <div class="dot-panel" id="dotPanel"></div>
  </div>

  <div id="qArea"></div>

  <div class="nav-buttons">
    <button class="btn btn-prev" id="prevBtn" onclick="goPrev()">&#8592; Previous</button>
    <button class="btn btn-next" id="nextBtn" onclick="goNext()">Next &#8594;</button>
  </div>

  <div class="results-box" id="resultsBox">
    <div class="score" id="scoreText">0 / 20</div>
    <p id="resultsMsg" style="color:var(--sub);margin:8px 0 0;"></p>
  </div>

  <div class="actions">
    <button class="action-btn" id="retryBtn" onclick="retryWrongOnes()">Retry Wrong Ones</button>
    <button class="action-btn" onclick="saveWrongAnswers()">Save Wrong Answers</button>
    <button class="action-btn danger" onclick="openStartFreshModal()">Start Fresh</button>
  </div>
</div>

<div class="modal-overlay" id="startFreshModal">
  <div class="modal-box">
    <h3>Start fresh?</h3>
    <p>This will clear all of today's answers and progress for this quiz. This cannot be undone.</p>
    <div class="modal-buttons">
      <button class="modal-btn modal-cancel" onclick="closeStartFreshModal()">Cancel</button>
      <button class="modal-btn modal-confirm" onclick="confirmStartFresh()">Start Fresh</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var QUESTIONS = [{"stem": "An opinion article about a proposed bike lane states: 'Every reasonable person agrees this project is a waste of money, and only reckless cyclists could think otherwise.' What does this sentence reveal about the article?", "opts": ["It relies entirely on statistics from a city traffic survey.", "It shows bias by dismissing anyone who disagrees instead of offering evidence.", "It is a purely factual, objective summary of the project.", "It presents a balanced, well-supported argument."], "ci": 1, "exp": "The sentence insults anyone who disagrees ('reckless cyclists') instead of presenting supporting evidence, which is a sign of bias rather than objective, evidence-based writing.", "tag": "Reading: Literature & Informational Text", "tagcolor": "#185FA5"}, {"stem": "A student sees a headline that reads: 'You Won't BELIEVE What This Teacher Did — Click to Find Out!' What media literacy concern does this headline raise?", "opts": ["It cites a specific, credible source.", "It is designed as clickbait, using vague, sensational language to get clicks rather than informing the reader.", "It clearly summarizes the article's main facts.", "It uses no persuasive techniques at all."], "ci": 1, "exp": "The vague, sensational wording is meant to create curiosity and drive clicks rather than inform, which is a hallmark of clickbait headlines that students should evaluate critically.", "tag": "Media Literacy", "tagcolor": "#E24B4A"}, {"stem": "Which sentence is written in the passive voice?", "opts": ["The new policy was approved by the committee.", "The committee will approve the new policy tomorrow.", "The committee is approving the new policy.", "The committee approved the new policy."], "ci": 0, "exp": "In this sentence, the subject ('the new policy') receives the action instead of performing it, and the verb phrase 'was approved' shows the passive construction.", "tag": "Language: Grammar & Vocabulary Structure", "tagcolor": "#f5a623"}, {"stem": "During a group discussion, a student wants to build on a classmate's point rather than simply repeating it. Which sentence best does this?", "opts": ["I agree with what you said.", "Building on your point about the character's fear, I'd add that her fear actually motivates her to act bravely later.", "That's interesting, but I have a different topic to talk about.", "I wasn't really listening, but sure."], "ci": 1, "exp": "This response references the classmate's specific point about fear and then extends it with a new idea, which is what it means to build on another speaker's contribution.", "tag": "Speaking & Listening", "tagcolor": "#7b61ff"}, {"stem": "During a Socratic seminar, a student disagrees with a classmate's interpretation of a novel's ending. What is the most effective way for the student to respond?", "opts": ["Changing the subject to something unrelated.", "I see it differently — on page 210, the author writes that the character finally forgives her father, which suggests hope rather than defeat.", "You're wrong, and that's a bad interpretation.", "Saying nothing and waiting for someone else to speak."], "ci": 1, "exp": "This response respectfully disagrees while citing specific textual evidence from page 210, which is the goal of academic discussion in a Socratic seminar.", "tag": "Speaking & Listening", "tagcolor": "#7b61ff"}, {"stem": "The word 'benevolent' comes from the Latin roots 'bene' (good) and 'vol' (to wish). Based on these roots, what does 'benevolent' most likely mean?", "opts": ["Lacking in energy", "Extremely angry", "Difficult to understand", "Kind and generous"], "ci": 3, "exp": "Combining 'bene' (good) and 'vol' (to wish) points to someone who wishes good things for others, meaning kind and generous.", "tag": "Language: Grammar & Vocabulary Structure", "tagcolor": "#f5a623"}, {"stem": "Early in a novel, a character notices dark clouds gathering on the horizon just before her family leaves for a picnic, but she says nothing and climbs into the car. Later, the picnic is interrupted by a violent thunderstorm. What literary technique is the author using with the description of the clouds?", "opts": ["Foreshadowing", "Flashback", "Comic relief", "A symbol of hope"], "ci": 0, "exp": "The early detail about the clouds hints at trouble to come before it actually happens in the story, which is the definition of foreshadowing.", "tag": "Reading: Literature & Informational Text", "tagcolor": "#185FA5"}, {"stem": "A student revises a narrative to add more sensory detail. Which revision most improves the sentence 'Maria walked into the kitchen and made breakfast'?", "opts": ["Maria went to the kitchen. She made breakfast. It was good.", "Maria walked into the kitchen and made breakfast that morning.", "Maria walked into the kitchen and made breakfast, which was nice.", "Maria stepped into the warm kitchen, the smell of cinnamon and melting butter filling the air as the pan sizzled."], "ci": 3, "exp": "This revision appeals to smell, sound, and touch (warmth, cinnamon, sizzling), giving the reader sensory details that the other revisions lack.", "tag": "Writing (Argumentative/Informational/Narrative/Research)", "tagcolor": "#1D9E75"}, {"stem": "Which sentence correctly uses the subjunctive mood to express a wish or hypothetical situation?", "opts": ["If I were taller, I would join the basketball team.", "If I will be taller, I would join the basketball team.", "If I am taller, I would join the basketball team.", "If I was taller, I would join the basketball team."], "ci": 0, "exp": "The subjunctive mood uses 'were' instead of 'was' for hypothetical situations that are contrary to fact, exactly as shown in this sentence.", "tag": "Language: Grammar & Vocabulary Structure", "tagcolor": "#f5a623"}, {"stem": "A student finds two articles about a new vaccine: one on a hospital's official research page with citations to clinical studies, and another on a personal blog with no sources listed and dramatic, all-caps headlines. Which article is more likely to be reliable, and why?", "opts": ["The hospital's research page, because it cites clinical studies and comes from a credible medical source", "The blog, because it has more exciting headlines", "Neither is reliable because they are both published on the internet", "Both are equally reliable since they are both online"], "ci": 0, "exp": "A source is more credible when it comes from a recognized authority and backs up its claims with citations, which describes the hospital's research page rather than the unsourced blog.", "tag": "Media Literacy", "tagcolor": "#E24B4A"}, {"stem": "A student is writing an informational essay comparing solar panels and wind turbines. Which sentence fits best in an informational essay, as opposed to a persuasive one?", "opts": ["Solar panels convert sunlight into electricity, while wind turbines convert the kinetic energy of moving air.", "Wind turbines are ugly and ruin the view of the countryside.", "Solar panels are clearly the superior choice, and anyone who disagrees hasn't done their research.", "You should install solar panels on your roof right now."], "ci": 0, "exp": "This sentence objectively explains how each technology works without arguing that one is better, which fits the goal of informational writing: explaining and comparing rather than persuading.", "tag": "Writing (Argumentative/Informational/Narrative/Research)", "tagcolor": "#1D9E75"}, {"stem": "In the sentence 'Swimming every morning improved her endurance,' what role does the word 'Swimming' play?", "opts": ["It is a present participle describing 'her'.", "It is an infinitive showing purpose.", "It is a gerund acting as the subject of the sentence.", "It is a linking verb."], "ci": 2, "exp": "'Swimming' functions as a noun that performs the action of the sentence ('Swimming ... improved'), which makes it a gerund used as the subject.", "tag": "Language: Grammar & Vocabulary Structure", "tagcolor": "#f5a623"}, {"stem": "In a poem, a character plants a small oak tree the same week her son is born. Over the following stanzas, the tree grows taller each time the son reaches a new milestone. What does the oak tree most likely symbolize?", "opts": ["The mother's fear of storms", "The family's move to a new house", "The changing seasons", "The son's growth and life"], "ci": 3, "exp": "Since the tree's growth is described alongside the son's milestones throughout the poem, the tree stands for, or symbolizes, the son's growth and life rather than any of the other ideas.", "tag": "Reading: Literature & Informational Text", "tagcolor": "#185FA5"}, {"stem": "A student is preparing a presentation on ocean pollution and wants to use a visual aid effectively. Which choice would help the audience most?", "opts": ["A slide with ten paragraphs of dense text read word-for-word", "Reading the entire research paper aloud without any slides", "A slide with no images or data, just the presentation title", "A simple chart showing plastic waste trends over the last decade, paired with a brief spoken explanation"], "ci": 3, "exp": "A simple chart highlights key data at a glance while the speaker explains it aloud, which supports audience understanding better than dense text or no visuals at all.", "tag": "Speaking & Listening", "tagcolor": "#7b61ff"}, {"stem": "A student is writing an argumentative essay claiming that schools should start later in the morning. Which sentence best strengthens the essay by addressing a counterargument?", "opts": ["Later start times are simply better for everyone, no matter what.", "Some worry that later start times would shorten after-school sports practice, but schools could adjust bus schedules instead of practice times.", "Sleep is important for teenagers.", "My little brother also likes to sleep in on weekends."], "ci": 1, "exp": "This sentence acknowledges an opposing concern about sports practice and then offers a reasonable response, which is what addressing a counterargument in an argumentative essay looks like.", "tag": "Writing (Argumentative/Informational/Narrative/Research)", "tagcolor": "#1D9E75"}, {"stem": "A student reads a written news article about a wildfire and then watches a video news report on the same wildfire. What is one key difference between the two formats?", "opts": ["The written article is always less accurate than the video.", "There is no meaningful difference between reading and watching news.", "The video can use footage, sound, and a reporter's tone of voice to create emotional impact in ways that plain text cannot.", "The written article cannot contain any facts."], "ci": 2, "exp": "Video adds visual footage, sound effects, and vocal tone, which can shape the audience's emotional response in ways that a purely written article cannot.", "tag": "Media Literacy", "tagcolor": "#E24B4A"}, {"stem": "A commercial shows a group of laughing teenagers at a party, followed by a quick shot of a soda can, without mentioning any facts about the product itself. What persuasive technique is this ad most likely using?", "opts": ["Associating the product with popularity and fun rather than providing factual information", "Citing scientific research about the soda's ingredients", "Comparing prices with competing brands", "Explaining the nutritional content of the soda"], "ci": 0, "exp": "The ad connects the product to a fun, popular lifestyle instead of giving any facts, which is a persuasive technique based on association rather than evidence.", "tag": "Media Literacy", "tagcolor": "#E24B4A"}, {"stem": "A student is practicing a speech and speaks very quickly while staring down at the notecards the entire time. What should the student do to improve delivery?", "opts": ["Read every word exactly as written without ever looking up", "Whisper so the audience has to lean in", "Slow down and make eye contact with the audience periodically", "Speak even faster to finish sooner"], "ci": 2, "exp": "Slowing the pace and looking up to make eye contact helps the audience follow along and feel engaged, which are key parts of effective delivery.", "tag": "Speaking & Listening", "tagcolor": "#7b61ff"}, {"stem": "In a short story, a fisherman risks his boat in a storm to save a stranger drowning nearby, even though he barely knows how to swim himself. Which sentence best states a possible theme of this story?", "opts": ["Fishermen are always better swimmers than other people.", "Strangers can never be trusted in an emergency.", "People should never go out in stormy weather.", "True courage often means risking your own safety to help someone else."], "ci": 3, "exp": "The fisherman's willingness to risk his own safety for someone he barely knows points to a theme about courage and sacrifice for others, which is exactly what this statement expresses.", "tag": "Reading: Literature & Informational Text", "tagcolor": "#185FA5"}, {"stem": "A student writes in a research report: 'Coral reefs support about 25% of all marine species (Ocean Conservancy).' What is the purpose of the information in parentheses?", "opts": ["To restate the sentence in different words", "To define the word 'species'", "To cite the source the statistic came from", "To add a personal opinion about coral reefs"], "ci": 2, "exp": "Naming the organization in parentheses right after the statistic shows the reader where that fact came from, which is the purpose of a citation in a research report.", "tag": "Writing (Argumentative/Informational/Narrative/Research)", "tagcolor": "#1D9E75"}];
  var QUIZ_TITLE = "Daily English Quiz";
  var STORAGE_KEY = "quiz_english_091426";

  // activeIndices: indices into QUESTIONS that are currently "in play"
  // (the full set by default; narrowed by Retry Wrong Ones)
  var activeIndices = [];
  var pos = 0; // position within activeIndices
  var answers = {}; // questionIndex -> chosen option index
  var wrongSet = {}; // questionIndex -> true if answered wrong (based on most recent answer)

  function defaultState(){
    return {
      activeIndices: QUESTIONS.map(function(_, i){ return i; }),
      pos: 0,
      answers: {},
      wrongSet: {}
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.activeIndices) return defaultState();
      return parsed;
    }catch(e){
      return defaultState();
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        activeIndices: activeIndices,
        pos: pos,
        answers: answers,
        wrongSet: wrongSet
      }));
    }catch(e){ /* ignore quota errors */ }
  }

  function init(){
    var st = loadState();
    activeIndices = st.activeIndices;
    pos = Math.min(st.pos || 0, Math.max(activeIndices.length - 1, 0));
    answers = st.answers || {};
    wrongSet = st.wrongSet || {};
    renderQuestion();
    renderDots();
    updateNav();
  }

  function currentQIndex(){
    return activeIndices[pos];
  }

  function renderQuestion(){
    var qi = currentQIndex();
    var q = QUESTIONS[qi];
    var area = document.getElementById("qArea");
    var html = '';
    html += '<div class="qcard">';
    html += '<div class="qnum">Question ' + (pos + 1) + ' of ' + activeIndices.length + '</div>';
    html += '<span class="tag" style="background:' + q.tagcolor + ';">' + (pos+1) + '. [' + q.tag + ']</span>';
    html += '<div class="stem">' + q.stem + '</div>';
    html += '<div id="optsHolder">';
    for(var i = 0; i < q.opts.length; i++){
      html += '<button class="opt" id="opt_' + i + '" onclick="selectOption(' + i + ')">' + q.opts[i] + '</button>';
    }
    html += '</div>';
    html += '<div class="explain" id="explainBox"></div>';
    html += '</div>';
    area.innerHTML = html;

    var chosen = answers[qi];
    if(typeof chosen === "number"){
      lockOptions(qi, chosen);
    }
    updatePrevNextButtons();
  }

  function lockOptions(qi, chosen){
    var q = QUESTIONS[qi];
    for(var i = 0; i < q.opts.length; i++){
      var btn = document.getElementById("opt_" + i);
      if(!btn) continue;
      btn.disabled = true;
      if(i === q.ci){
        btn.classList.add("reveal-correct");
      }
      if(i === chosen && chosen !== q.ci){
        btn.classList.add("selected-wrong");
      }
      if(i === chosen && chosen === q.ci){
        btn.classList.add("selected-correct");
      }
    }
    var exp = document.getElementById("explainBox");
    if(exp){
      exp.innerHTML = "<b>Explanation:</b> " + q.exp;
      exp.classList.add("show");
    }
  }

  function selectOption(i){
    var qi = currentQIndex();
    if(typeof answers[qi] === "number") return; // already answered, no changes
    var q = QUESTIONS[qi];
    answers[qi] = i;
    wrongSet[qi] = (i !== q.ci);
    lockOptions(qi, i);
    saveState();
    renderDots();
    updateNav();
  }

  function goPrev(){
    if(pos > 0){
      pos -= 1;
      renderQuestion();
      saveState();
      renderDots();
    }
  }

  function goNext(){
    if(pos < activeIndices.length - 1){
      pos += 1;
      renderQuestion();
      saveState();
      renderDots();
    }
  }

  function updatePrevNextButtons(){
    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");
    if(prevBtn) prevBtn.disabled = (pos === 0);
    if(nextBtn) nextBtn.disabled = (pos === activeIndices.length - 1);
  }

  function answeredCount(){
    var n = 0;
    for(var k = 0; k < activeIndices.length; k++){
      if(typeof answers[activeIndices[k]] === "number") n++;
    }
    return n;
  }

  function updateNav(){
    var total = activeIndices.length;
    var answered = answeredCount();
    var countEl = document.getElementById("navCount");
    if(countEl) countEl.textContent = answered + " / " + total;
    var fill = document.getElementById("progressFill");
    if(fill) fill.style.width = (total > 0 ? Math.round((answered / total) * 100) : 0) + "%";
    var pill = document.getElementById("resultsPill");
    if(pill) pill.style.display = (answered === total && total > 0) ? "inline-block" : "none";
    updatePrevNextButtons();
  }

  function renderDots(){
    var panel = document.getElementById("dotPanel");
    if(!panel) return;
    var html = '';
    for(var k = 0; k < activeIndices.length; k++){
      var qi = activeIndices[k];
      var cls = "dot";
      if(typeof answers[qi] === "number"){
        cls += (wrongSet[qi] ? " wrong" : " correct");
      }
      if(k === pos) cls += " current";
      html += '<button class="' + cls + '" onclick="jumpTo(' + k + ')">' + (k+1) + '</button>';
    }
    panel.innerHTML = html;
  }

  function jumpTo(k){
    pos = k;
    renderQuestion();
    saveState();
    renderDots();
  }

  function toggleJump(){
    var panel = document.getElementById("dotPanel");
    var btn = document.getElementById("jumpBtn");
    if(!panel || !btn) return;
    var isOpen = panel.style.display === "flex";
    panel.style.display = isOpen ? "none" : "flex";
    btn.innerHTML = isOpen ? "Jump &#9662;" : "Hide &#9652;";
  }

  function showResults(){
    var box = document.getElementById("resultsBox");
    var scoreText = document.getElementById("scoreText");
    var msg = document.getElementById("resultsMsg");
    var correct = 0, total = activeIndices.length;
    for(var k = 0; k < activeIndices.length; k++){
      var qi = activeIndices[k];
      if(typeof answers[qi] === "number" && !wrongSet[qi]) correct++;
    }
    if(scoreText) scoreText.textContent = correct + " / " + total;
    if(msg) msg.textContent = (correct === total)
      ? "Great job — every question correct!"
      : "Use Retry Wrong Ones to practice the questions you missed.";
    if(box) box.style.display = "block";
    box.scrollIntoView({behavior:"smooth", block:"center"});
  }

  function retryWrongOnes(){
    var wrongIndices = activeIndices.filter(function(qi){
      return typeof answers[qi] === "number" && wrongSet[qi];
    });
    if(wrongIndices.length === 0){
      showToast("No wrong answers to retry right now.");
      return;
    }
    // Build a fresh active subset from the wrong questions only.
    activeIndices = wrongIndices;
    pos = 0;
    // Clear answers only for the questions being retried, so they can be re-answered.
    for(var i = 0; i < activeIndices.length; i++){
      delete answers[activeIndices[i]];
      delete wrongSet[activeIndices[i]];
    }
    var resultsBox = document.getElementById("resultsBox");
    if(resultsBox) resultsBox.style.display = "none";
    renderQuestion();
    renderDots();
    updateNav();
    saveState();
    showToast("Retrying " + activeIndices.length + " question(s) you missed.");
  }

  function saveWrongAnswers(){
    var wrongAnswers = [];
    for(var qi = 0; qi < QUESTIONS.length; qi++){
      if(typeof answers[qi] === "number" && wrongSet[qi]){
        var q = QUESTIONS[qi];
        wrongAnswers.push({
          question: q.stem,
          yourAnswer: q.opts[answers[qi]],
          correctAnswer: q.opts[q.ci],
          explanation: q.exp
        });
      }
    }
    if(wrongAnswers.length === 0){
      showToast("No wrong answers to save yet.");
      return;
    }
    var payload = { title: QUIZ_TITLE, wrongAnswers: wrongAnswers };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = STORAGE_KEY + "_wrong_answers.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Saved " + wrongAnswers.length + " wrong answer(s).");
  }

  function openStartFreshModal(){
    var overlay = document.getElementById("startFreshModal");
    if(overlay) overlay.classList.add("show");
  }
  function closeStartFreshModal(){
    var overlay = document.getElementById("startFreshModal");
    if(overlay) overlay.classList.remove("show");
  }
  function confirmStartFresh(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    activeIndices = QUESTIONS.map(function(_, i){ return i; });
    pos = 0;
    answers = {};
    wrongSet = {};
    var resultsBox = document.getElementById("resultsBox");
    if(resultsBox) resultsBox.style.display = "none";
    closeStartFreshModal();
    renderQuestion();
    renderDots();
    updateNav();
    saveState();
    showToast("Started fresh.");
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    if(!t) return;
    t.textContent = msg;
    t.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  window.toggleJump = toggleJump;
  window.showResults = showResults;
  window.retryWrongOnes = retryWrongOnes;
  window.saveWrongAnswers = saveWrongAnswers;
  window.openStartFreshModal = openStartFreshModal;
  window.closeStartFreshModal = closeStartFreshModal;
  window.confirmStartFresh = confirmStartFresh;
  window.selectOption = selectOption;
  window.goPrev = goPrev;
  window.goNext = goNext;
  window.jumpTo = jumpTo;

  init();
</script>
</body>
</html>
